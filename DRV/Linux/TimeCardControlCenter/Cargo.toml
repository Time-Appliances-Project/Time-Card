[package]
name = "timecard-control-center"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "Native Linux control and telemetry center for the OCP Time Card"
repository = "https://github.com/Time-Appliances-Project/Time-Card"
publish = false
default-run = "timecard-control-center"

[features]
default = ["gui"]
gui = ["dep:directories", "dep:relm4"]
tui = ["dep:crossterm", "dep:directories", "dep:ratatui", "dep:unicode-width"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive", "env"] }
libc = "0.2.186"
nix = { version = "0.31.3", features = ["ioctl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dependencies.crossterm]
version = "0.29.0"
optional = true

[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]
optional = true

[dependencies.unicode-width]
version = "0.2.2"
optional = true

[dependencies.directories]
version = "6.0.0"
optional = true

[dependencies.relm4]
version = "0.11.0"
default-features = false
features = ["gnome_42", "libadwaita", "macros"]
optional = true

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[[bin]]
name = "timecard-control-center"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "timecard-control-center-tui"
path = "src/bin/timecard-control-center-tui.rs"
required-features = ["tui"]
