# OCP Time Card / Orolia-Safran ART integration profile

# The daemon disciplines the mRO-50 and exposes monitoring telemetry.
disciplining=true
monitoring=true

# Discover /sys/class/timecard/ocpN from the Linux ptp_ocp driver.
sysfs-path=auto
timecard-index=0
oscillator=mRO50

# Safe default: accept monitoring only from this Linux host. To connect from
# another machine, bind a specific trusted interface and restrict TCP/2958 in
# the host firewall. The protocol is not encrypted; an SSH local port forward
# to this loopback endpoint is preferred over exposing the port directly.
socket-address=127.0.0.1
socket-port=2958

# Status and EEPROM calibration reads are always available. All state-changing
# requests are denied unless explicitly enabled. Set a long random token before
# enabling control, especially on any non-loopback interface.
monitoring-allow-control=false
# monitoring-control-token=replace-with-a-long-random-secret

# GNSS behavior
gnss-bypass-survey=false
gnss-receiver-reconfigure=false
# gnss-cable-delay=85
# gnss-preferred-time-scale=UTC
# gnss-rtcm-enabled=false

# Phase-meter convention and logging (0 trace, 1 debug, 2 info, 3 warn, ...)
opposite-phase-error=false
debug=2

# Oscillator disciplining algorithm
calibrate_first=false
phase_resolution_ns=5
ref_fluctuations_ns=30
phase_jump_threshold_ns=300
reactivity_min=10
reactivity_max=30
reactivity_power=2
fine_stop_tolerance=100
max_allowed_coarse=20
nb_calibration=50
learn_temperature_table=false
use_temperature_table=false
oscillator_factory_settings=true
tracking_only=false
fine_table_output_path=/var/lib/oscillatord/
