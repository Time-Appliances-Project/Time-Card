name: Linux Control Center

on:
  push:
    paths:
      - "DRV/Linux/TimeCardControlCenter/**"
      - ".github/workflows/linux-control-center.yml"
  pull_request:
    paths:
      - "DRV/Linux/TimeCardControlCenter/**"
      - ".github/workflows/linux-control-center.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTROL_CENTER: DRV/Linux/TimeCardControlCenter

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CONTROL_CENTER }} -> target

      - name: Check formatting
        run: cargo fmt --manifest-path "$CONTROL_CENTER/Cargo.toml" --all -- --check

      - name: Test the GTK-independent core
        run: >-
          cargo test
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --all-targets

      - name: Lint the GTK-independent core
        run: >-
          cargo clippy
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --all-targets
          -- -D warnings

  headless-tui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CONTROL_CENTER }} -> target

      - name: Lint the terminal application
        run: >-
          cargo clippy
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --features tui
          --all-targets
          -- -D warnings

      - name: Test the terminal application
        run: >-
          cargo test
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --features tui
          --all-targets

      - name: Build the terminal release binary
        run: >-
          cargo build
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --release
          --no-default-features
          --features tui
          --bin timecard-control-center-tui

      - name: Plain terminal smoke test
        run: |
          output_file="$RUNNER_TEMP/timecard-tui.txt"
          timeout 5s \
            "$CONTROL_CENTER/target/release/timecard-control-center-tui" \
            --mock --plain --page timing-io > "$output_file"
          grep -F "Timing I/O" "$output_file"
          grep -F "mock0" "$output_file"
          grep -F "IRIG/DCF" "$output_file"
          if LC_ALL=C grep -q $'\033' "$output_file"; then
            echo "plain terminal output contains an escape byte" >&2
            exit 1
          fi

  native-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, libadwaita, and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            build-essential \
            dbus-x11 \
            desktop-file-utils \
            libadwaita-1-dev \
            libgtk-4-dev \
            linux-libc-dev \
            pkg-config \
            xauth \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CONTROL_CENTER }} -> target

      - name: Lint the desktop application
        run: >-
          cargo clippy
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --features gui
          --all-targets
          -- -D warnings

      - name: Test the desktop application
        env:
          GTK_A11Y: none
        run: >-
          xvfb-run -a dbus-run-session --
          cargo test
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --no-default-features
          --features gui

      - name: Build release binary
        run: >-
          cargo build
          --manifest-path "$CONTROL_CENTER/Cargo.toml"
          --locked
          --release
          --all-features

      - name: Validate desktop metadata
        run: |
          desktop-file-validate \
            "$CONTROL_CENTER/packaging/org.opentimeserver.TimeCardControlCenter.desktop"
          appstreamcli validate --no-net \
            "$CONTROL_CENTER/packaging/org.opentimeserver.TimeCardControlCenter.metainfo.xml"

      - name: Stage install
        run: |
          install_root="$RUNNER_TEMP/timecard-install"
          install -Dm0755 \
            "$CONTROL_CENTER/target/release/timecard-control-center" \
            "$install_root/usr/bin/timecard-control-center"
          install -Dm0755 \
            "$CONTROL_CENTER/target/release/timecard-control-center-tui" \
            "$install_root/usr/bin/timecard-control-center-tui"
          install -Dm0644 \
            "$CONTROL_CENTER/packaging/org.opentimeserver.TimeCardControlCenter.desktop" \
            "$install_root/usr/share/applications/org.opentimeserver.TimeCardControlCenter.desktop"
          install -Dm0644 \
            "$CONTROL_CENTER/packaging/org.opentimeserver.TimeCardControlCenter.svg" \
            "$install_root/usr/share/icons/hicolor/scalable/apps/org.opentimeserver.TimeCardControlCenter.svg"
          install -Dm0644 \
            "$CONTROL_CENTER/packaging/org.opentimeserver.TimeCardControlCenter.metainfo.xml" \
            "$install_root/usr/share/metainfo/org.opentimeserver.TimeCardControlCenter.metainfo.xml"
          install -Dm0644 \
            "$CONTROL_CENTER/packaging/70-timecard-control-center.rules" \
            "$install_root/usr/lib/udev/rules.d/70-timecard-control-center.rules"

      - name: Mock dashboard smoke test
        working-directory: DRV/Linux/TimeCardControlCenter
        env:
          GTK_A11Y: none
        run: >-
          xvfb-run -a dbus-run-session --
          target/release/timecard-control-center
          --mock
          --quit-after 1500
